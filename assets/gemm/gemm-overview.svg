<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">GEMM overview</title>
  <desc id="desc">A row of matrix A and a column of matrix B form one element of matrix C.</desc>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#34445f" stroke-width="1.5" opacity="0.7"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0b1220" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#f7f8fb"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#162033">
    <text x="250" y="70" text-anchor="middle" font-size="34" font-weight="700">A</text>
    <text x="250" y="102" text-anchor="middle" font-size="22" fill="#58667d">M x K</text>
    <text x="605" y="70" text-anchor="middle" font-size="34" font-weight="700">B</text>
    <text x="605" y="102" text-anchor="middle" font-size="22" fill="#58667d">K x N</text>
    <text x="970" y="70" text-anchor="middle" font-size="34" font-weight="700">C</text>
    <text x="970" y="102" text-anchor="middle" font-size="22" fill="#58667d">M x N</text>

    <g filter="url(#shadow)">
      <rect x="90" y="130" width="320" height="280" rx="16" fill="#dce9ff" stroke="#283b5c" stroke-width="3"/>
      <rect x="90" y="130" width="320" height="280" rx="16" fill="url(#grid)"/>
      <rect x="91.5" y="255" width="317" height="42" fill="#ff9e8f" opacity="0.92"/>

      <rect x="520" y="130" width="170" height="280" rx="16" fill="#fff0bd" stroke="#283b5c" stroke-width="3"/>
      <rect x="520" y="130" width="170" height="280" rx="16" fill="url(#grid)"/>
      <rect x="604" y="131.5" width="42" height="277" fill="#71d7c7" opacity="0.94"/>

      <rect x="840" y="130" width="260" height="280" rx="16" fill="#e8ddff" stroke="#283b5c" stroke-width="3"/>
      <rect x="840" y="130" width="260" height="280" rx="16" fill="url(#grid)"/>
      <rect x="966" y="256" width="42" height="42" rx="6" fill="#a982f1" stroke="#563f91" stroke-width="3"/>
    </g>

    <text x="463" y="292" text-anchor="middle" font-size="46" font-weight="500">x</text>
    <text x="765" y="292" text-anchor="middle" font-size="46" font-weight="500">=</text>

    <path d="M 256 455 C 420 520, 790 520, 974 455" fill="none" stroke="#65748d" stroke-width="3" stroke-dasharray="9 10"/>
    <circle cx="256" cy="455" r="6" fill="#ff7664"/>
    <circle cx="974" cy="455" r="6" fill="#7650ca"/>
    <text x="610" y="520" text-anchor="middle" font-size="24" fill="#4c5a71">one row dot one column gives one output</text>
  </g>
</svg>
